<!-- Trust strip -->
<section class="trust" aria-label="Licences and track record">
  <div class="container">
    <ul class="trust__list">
      <li>{{icon shield}}<span>{{ph LICENSING BODY}} Licence {{ph LICENCE NO.}}</span></li>
      <li>{{icon kaaba}}<span>MoRA Verified Umrah Operator</span></li>
      <li>{{icon calendar}}<span><strong>{{ph YEARS}}+</strong> Years of Experience</span></li>
      <li>{{icon users}}<span><strong>{{ph NUMBER}}+</strong> Happy Travellers</span></li>
      <li>{{icon star}}<span><strong>{{ph RATING}}</strong> Rating on Google</span></li>
    </ul>
  </div>
</section>
