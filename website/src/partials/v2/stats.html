<!-- ============ 8 · NUMBERS (v2: the counters run with your scroll over a drifting dot pattern, js/v2/30-showcase.js) ============ -->
<section class="stats" aria-labelledby="stats-title" data-v2-stats>
  <div class="stats__sky" aria-hidden="true"><i class="stats__dots"></i></div>
  <div class="container stats__inner">
    <h2 id="stats-title" class="stats__title" data-reveal>Marjan Travel &amp; Tours in Numbers</h2>
    <dl class="stats__grid">
      <div class="stat" data-reveal><dt>Years of experience</dt><dd><span class="count" data-v2-count>6</span>{{icon stat-plus stat__suf}}<span class="sr-only">+</span></dd></div>
      <div class="stat" data-reveal style="--d:1"><dt>Travellers served</dt><dd><span class="count" data-v2-count>5,500</span>{{icon stat-plus stat__suf}}<span class="sr-only">+</span></dd></div>
      <div class="stat" data-reveal style="--d:2"><dt>Pilgrims served</dt><dd><span class="count" data-v2-count>2,200</span>{{icon stat-plus stat__suf}}<span class="sr-only">+</span></dd></div>
      <div class="stat" data-reveal style="--d:3"><dt>Visa applications processed</dt><dd><span class="count" data-v2-count>1,500</span>{{icon stat-plus stat__suf}}<span class="sr-only">+</span></dd></div>
    </dl>
  </div>
</section>
