<!-- ============ 6 · DESTINATIONS (pick a place, the large 16:9 photo changes; v2: the photo opens like a window as you scroll in) ============ -->
<section class="dest dest--fit section section--tint" aria-labelledby="dest-title" data-v2-dest>
  <div class="container">
    <div class="section-head section-head--split">
      <div data-reveal>
        <h2 id="dest-title">Top Destinations in Pakistan and Abroad</h2>
      </div>
      <div class="seg" role="tablist" aria-label="Destination region" data-tabs data-reveal style="--d:1">
        <span class="seg__thumb" aria-hidden="true"></span>
        <button class="seg__btn" role="tab" id="tab-pk" aria-controls="panel-pk" aria-selected="true">{{icon mountain}}Explore Pakistan</button>
        <button class="seg__btn" role="tab" id="tab-ab" aria-controls="panel-ab" aria-selected="false" tabindex="-1">{{icon globe}}Holidays Abroad</button>
      </div>
    </div>

    <div class="dest__panel" id="panel-pk" role="tabpanel" aria-labelledby="tab-pk">
      <h3 class="sr-only">Explore Pakistan</h3>
      <div class="dsh" data-dsh>
        <div class="dsh__stage">
        <figure class="dsh__slide is-active" data-dsh-slide>
          {{img id="1646514323421-094bb563cd37" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" alt="Karakoram Highway towards the Passu Cones, Hunza Valley"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Hunza Valley</h4>
            <p class="dsh__desc">Karimabad, Baltit and Altit forts, Attabad Lake and the Passu Cones.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        <figure class="dsh__slide" data-dsh-slide>
          {{img id="1709634483655-c0384d8a100f" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" defer alt="Lake below snow-covered mountains near Skardu"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Skardu</h4>
            <p class="dsh__desc">Shangrila and Upper Kachura lakes, Shigar Fort and the Deosai Plains.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        <figure class="dsh__slide" data-dsh-slide>
          {{img id="1550586678-f7225f03c44b" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" defer alt="Green mountain meadow with a wooden cabin in Swat"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Swat</h4>
            <p class="dsh__desc">Kalam, Malam Jabba and Mahodand Lake, the “Switzerland of Pakistan”.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        <figure class="dsh__slide" data-dsh-slide>
          {{img id="1573143686363-30560f0abc1d" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" defer alt="Lake Saiful Muluk surrounded by mountains, Naran Kaghan"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Naran Kaghan</h4>
            <p class="dsh__desc">Lake Saiful Muluk, Babusar Top and Lulusar Lake.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        <figure class="dsh__slide" data-dsh-slide>
          {{img id="1585654766816-8a9fe569d445" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" defer alt="Snow-covered houses in Murree in winter"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Murree &amp; Galiyat</h4>
            <p class="dsh__desc">Weekend escapes from Islamabad and Lahore, with snow in winter.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        <figure class="dsh__slide" data-dsh-slide>
          {{img id="1659553761498-6a8728fbf281" ratio="16/9" widths="640,960,1280,1600" sizes="(min-width: 1240px) 760px, (min-width: 1024px) 60vw, 92vw" w="1280" defer alt="Village in a green valley between mountains, Neelum Valley"}}
          <figcaption class="dsh__cap">
            <h4 class="dsh__name">Neelum Valley</h4>
            <p class="dsh__desc">Keran, Sharda and Arang Kel in Azad Kashmir.</p>
            <a class="dsh__link" href="/services/pakistan-tour-packages/">Plan this trip {{icon arrow-right}}</a>
          </figcaption>
        </figure>
        </div>
        <ul class="dsh__list">
        <li style="--i:0"><button class="dsh__item is-active" type="button" aria-pressed="true" data-dsh-item>{{img id="1646514323421-094bb563cd37" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Hunza Valley</strong><small>Gilgit-Baltistan</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:1"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1709634483655-c0384d8a100f" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Skardu</strong><small>Gilgit-Baltistan</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:2"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1550586678-f7225f03c44b" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Swat</strong><small>Khyber Pakhtunkhwa</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:3"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1573143686363-30560f0abc1d" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Naran Kaghan</strong><small>Khyber Pakhtunkhwa</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:4"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1585654766816-8a9fe569d445" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Murree &amp; Galiyat</strong><small>Punjab</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:5"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1659553761498-6a8728fbf281" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Neelum Valley</strong><small>Azad Kashmir</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        </ul>
      </div>
    </div>

    <div class="dest__panel" id="panel-ab" role="tabpanel" aria-labelledby="tab-ab" hidden>
      <h3 class="sr-only">Holidays Abroad</h3>

        <div class="dsh__stage">
        <figure class="dsh__slide is-active" data-dsh-slide>

        <li style="--i:0"><button class="dsh__item is-active" type="button" aria-pressed="true" data-dsh-item>{{img id="1518684079-3c830dcef090" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Dubai</strong><small>United Arab Emirates</small></span>{{icon arrow-right dsh__arrow}}</button></li>
        <li style="--i:1"><button class="dsh__item" type="button" aria-pressed="false" data-dsh-item>{{img id="1604156789095-3348604c0f43" ratio="1/1" widths="96,192" sizes="64px" w="192" alt=""}}<span class="dsh__meta"><strong>Turkey</strong><small>Istanbul, Cappadocia, Antalya</small></span>{{icon arrow-right dsh__arrow}}</button></li>

</section>
