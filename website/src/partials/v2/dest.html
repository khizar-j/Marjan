<!-- ============ 6 · DESTINATIONS (pick a place, the large 16:9 photo changes; v2: the photo opens like a window as you scroll in)
     The client's own lists (Nov 2026), in their order. "Plan this trip" opens WhatsApp with the place in the message. --n on .dsh = number of places, so the list matches the photo's height on desktop. ============ -->
<section class="dest dest--fit section section--tint" aria-labelledby="dest-title" data-v2-dest>

    <div class="section-head section-head--split">
      <div data-reveal>

        <button class="seg__btn" role="tab" id="tab-ab" aria-controls="panel-ab" aria-selected="false" tabindex="-1">{{icon globe}}Holidays Abroad</button>
      </div>
    </div>
