<!-- SAMPLE REVIEWS FOR THE DESIGN PREVIEW ONLY. Before launch, replace every review below with a REAL Google review
     (first name, city, service, month), copied word for word. Never publish invented reviews. The visible "Sample reviews"

<section class="reviews section" aria-labelledby="reviews-title">
  <div class="container">
    <div class="rv-head">
      <h2 id="reviews-title" data-reveal>What Our Travellers Say</h2>
      <div class="rv-nav" data-reveal style="--d:1">
        <button class="rv-btn rv-btn--prev" type="button" data-rv-prev aria-label="Previous reviews">{{icon arrow-right}}</button>
        <button class="rv-btn" type="button" data-rv-next aria-label="Next reviews">{{icon arrow-right}}</button>
      </div>
    </div>
  </div>
  <div class="rv-track" data-rv-track data-scroller="rv" tabindex="0" role="region" aria-label="Traveller reviews, scroll sideways for more">

        <span class="stars" role="img" aria-label="5 out of 5 stars">{{icon star}}{{icon star}}{{icon star}}{{icon star}}{{icon star}}</span>

      </figure>
      <figure class="rv">
