<!-- ============ 1 · HERO (interactive journey picker over the client's 8-second video for each journey) ============
     Each slide shows its poster (the video's first frame) at once; js/site/10-hero.js adds the muted video after the
     page has loaded. The clip sets the pace: each journey plays its clip once, then the next one starts as it ends.
     data-video is the file stem: -1080.mp4 (the client's file as uploaded), -m.mp4 (phones, upright cut). data-duration is only the
     fallback timer for visitors who get posters only (Save-Data). -->
<section class="hero" aria-labelledby="hero-title" data-hero data-duration="8000" data-no-parallax>
  <div class="hero__media">
    <figure class="hero__slide is-active" data-slide="umrah" data-video="/assets/video/hero-umrah" style="--pos:58% 50%">
      <picture>
        <source media="(max-width: 639.98px) and (orientation: portrait)" srcset="/assets/video/hero-umrah-m.webp">
        <img src="/assets/video/hero-umrah.webp" width="1600" height="900" fetchpriority="high" alt="Pilgrims in white circling the Kaaba in Masjid al-Haram, Makkah: Umrah packages from Pakistan by Marjan Travel &amp; Tours">
      </picture>
    </figure>
    <figure class="hero__slide" data-slide="north" data-video="/assets/video/hero-north" style="--pos:50% 50%">
      <picture>
        <source media="(max-width: 639.98px) and (orientation: portrait)" data-srcset="/assets/video/hero-north-m.webp">
        <img data-src="/assets/video/hero-north.webp" width="1600" height="900" decoding="async" alt="Travellers on a bridge over a mountain river in northern Pakistan">
      </picture>
    </figure>
    <figure class="hero__slide" data-slide="abroad" data-video="/assets/video/hero-abroad" style="--pos:62% 50%">
      <picture>
        <source media="(max-width: 639.98px) and (orientation: portrait)" data-srcset="/assets/video/hero-abroad-m.webp">
        <img data-src="/assets/video/hero-abroad.webp" width="1600" height="900" decoding="async" alt="The Dubai skyline and Burj Khalifa at dusk">
      </picture>
    </figure>
    <figure class="hero__slide" data-slide="visa" data-video="/assets/video/hero-visa" style="--pos:66% 50%">
      <picture>
        <source media="(max-width: 639.98px) and (orientation: portrait)" data-srcset="/assets/video/hero-visa-m.webp">
        <img data-src="/assets/video/hero-visa.webp" width="1600" height="900" decoding="async" alt="The UAE flag flying over the Dubai skyline">
      </picture>
    </figure>
    <figure class="hero__slide" data-slide="corporate" data-video="/assets/video/hero-corporate" style="--pos:66% 50%">
      <picture>
        <source media="(max-width: 639.98px) and (orientation: portrait)" data-srcset="/assets/video/hero-corporate-m.webp">
        <img data-src="/assets/video/hero-corporate.webp" width="1600" height="900" decoding="async" alt="A business traveller with a suitcase looking out of an airport window">
      </picture>
    </figure>
    <div class="hero__shade" aria-hidden="true"></div>
  </div>

  <div class="container hero__inner">
    <div class="hero__content">
      <!-- One H1 in two parts: a small label line (the local search phrase) over one big line (the three main services).
           Two lines on every phone, however long the city name, and both keyword sets stay in the H1.
           The hidden colon keeps the heading's text from running on ("… in Lahore: Umrah, …", not "… in Lahore Umrah, …"). -->
      <h1 id="hero-title" class="hero__title"><span class="hero__kicker">Travel Agency in Lahore</span><span class="sr-only">:</span> Umrah, Visas &amp; Tours</h1>
      <p class="hero__tagline" aria-label="Dream it. Book it. Live it.">
        <span>Dream it.</span> <span>Book it.</span> <span>Live it.</span>
      </p>
      <p class="hero__lead">Umrah, visas, Pakistan tours, holidays abroad and corporate trips, with flights, hotels and transport arranged for you.</p>
      <div class="hero__ctas">
        <a class="btn btn--primary btn--lg" href="/contact-us/">Get a Free Quote {{icon arrow-right}}</a>
        <a class="btn btn--glass btn--lg" href="https://wa.me/" data-wa>{{icon whatsapp}}WhatsApp Us</a>
      </div>
    </div>


    <div class="planner" data-planner>
      <div class="planner__tabs" role="group" aria-label="Choose your journey">
        <button class="planner__tab is-active" type="button" aria-pressed="true" data-journey="umrah">{{icon kaaba}}<span>Umrah</span></button>
        <button class="planner__tab" type="button" aria-pressed="false" data-journey="north">{{icon mountain}}<span>Pakistan Tours</span></button>
        <button class="planner__tab" type="button" aria-pressed="false" data-journey="abroad">{{icon globe}}<span>Holidays Abroad</span></button>
        <button class="planner__tab" type="button" aria-pressed="false" data-journey="visa">{{icon passport}}<span>Visas</span></button>
        <button class="planner__tab" type="button" aria-pressed="false" data-journey="corporate">{{icon briefcase}}<span>Corporate</span></button>
        <button class="planner__pause" type="button" aria-label="Pause slideshow and video" data-autoplay-toggle>{{icon pause i-pause}}{{icon play i-play}}</button>
      </div>
      <form class="planner__form" action="/contact-us/" method="get" autocomplete="off" data-planner-form>
        <input type="hidden" name="journey" value="Umrah" data-journey-input>
        <label class="planner__field planner__field--wide">
          <span class="planner__label" data-option-label>Package</span>
          <span class="planner__control">
            <select name="option" data-option>
              <option>Economy Package</option>
              <option>2-Star Package</option>
              <option>3-Star Package</option>
              <option selected>4-Star Package</option>
              <option>5-Star / VIP Package</option>
            </select>{{icon chevron-down}}
          </span>
        </label>
        <div class="planner__field">
          <label class="planner__label" for="travellers">Travellers</label>
          <span class="planner__control stepper">
            <button type="button" data-step="-1" aria-label="Fewer travellers">{{icon minus}}</button>
            <input id="travellers" name="travellers" type="number" inputmode="numeric" min="1" max="500" value="2" data-travellers>
            <button type="button" data-step="1" aria-label="More travellers">{{icon plus}}</button>
          </span>
        </div>
        <label class="planner__field">
          <span class="planner__label">When</span>
          <span class="planner__control">
            <select name="month" data-month><option>Flexible</option></select>{{icon chevron-down}}
          </span>
        </label>
        <button class="btn btn--primary planner__submit" type="submit">{{icon whatsapp}}<span>Get my quote</span></button>
      </form>
    </div>
  </div>
</section>
