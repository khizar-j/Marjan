<!-- ============ 12 · CLOSING CTA. The photo opens like a plane window as you scroll in (data-cta-window, js/site/40-closing.js) ============ -->
<section class="cta" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta__card" data-cta-window>
      <div class="cta__media"><picture>
        <source media="(max-width: 639.98px)" type="image/webp" srcset="/assets/img/cta/green-canyon-m-800.webp 800w" sizes="calc(100vw - 32px)" width="800" height="1000">
        <source media="(max-width: 899.98px)" type="image/webp" srcset="/assets/img/cta/green-canyon-t-1500.webp 1500w" sizes="92vw" width="1500" height="1000">
        <img src="/assets/img/cta/green-canyon-2000.webp" srcset="/assets/img/cta/green-canyon-2000.webp 2000w" sizes="(min-width: 1320px) 1240px, 94vw" width="2000" height="800" loading="lazy" decoding="async" alt="Wooden tour boat on the turquoise water of Green Canyon, Turkey">
      </picture></div>
      <div class="cta__content">
        <h2 id="cta-title">Ready to Plan Your Next Journey?</h2>
        <p>Tell us where you would like to go and we will send you a clear, no-obligation quotation. Pilgrimage, family holiday, business trip or team retreat, it all starts with one message.</p>
        <div class="cta__btns">
          <a class="btn btn--primary btn--lg" href="/contact-us/">Get a Free Quote {{icon arrow-right}}</a>
          <a class="btn btn--glass btn--lg" href="tel:+923038244423" aria-label="Call us on +92 303 8244423">{{icon phone}}Call us</a>
        </div>
      </div>
    </div>
  </div>
</section>
